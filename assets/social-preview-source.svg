<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111722"/>
      <stop offset="0.48" stop-color="#07090D"/>
      <stop offset="1" stop-color="#10131A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F26B38"/>
      <stop offset="0.48" stop-color="#F26B38"/>
      <stop offset="0.52" stop-color="#1E96FF"/>
      <stop offset="1" stop-color="#1E96FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="deviceClip">
      <rect x="48" y="154" width="500" height="371" rx="24"/>
    </clipPath>
    <clipPath id="appClip">
      <rect x="580" y="154" width="650" height="360" rx="24"/>
    </clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <circle cx="78" cy="52" r="88" fill="#F26B38" opacity="0.08"/>
  <circle cx="1190" cy="52" r="120" fill="#1E96FF" opacity="0.07"/>

  <text x="48" y="65" fill="#FFFFFF" font-size="49" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif">Claude &amp; Codex Status</text>
  <text x="48" y="103" fill="#B7C0CC" font-size="25" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif">for Stream Deck Neo</text>
  <rect x="48" y="122" width="1182" height="4" rx="2" fill="url(#accent)"/>

  <g filter="url(#shadow)">
    <rect x="42" y="148" width="512" height="383" rx="30" fill="#151A22" stroke="#F26B38" stroke-width="3"/>
    <image href="stream-deck-neo.jpg" x="48" y="154" width="500" height="371" preserveAspectRatio="xMidYMid slice" clip-path="url(#deviceClip)"/>
    <rect x="48" y="455" width="500" height="70" fill="#050608" opacity="0.78" clip-path="url(#deviceClip)"/>
    <text x="73" y="485" fill="#FFFFFF" font-size="22" font-weight="700" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif">STREAM DECK NEO</text>
    <text x="73" y="510" fill="#D1D7DF" font-size="17" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif">The hardware</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="574" y="148" width="662" height="372" rx="30" fill="#050608" stroke="#1E96FF" stroke-width="3"/>
    <image href="readme-preview.svg" x="580" y="154" width="650" height="360" preserveAspectRatio="xMidYMid meet" clip-path="url(#appClip)"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif" font-size="18" font-weight="700">
    <circle cx="598" cy="570" r="8" fill="#00DCE8"/>
    <text x="616" y="577" fill="#FFFFFF">NEEDS ATTENTION</text>
    <circle cx="832" cy="570" r="8" fill="#69E6A6"/>
    <text x="850" y="577" fill="#FFFFFF">WORKING</text>
    <circle cx="1000" cy="570" r="8" fill="#F26B38"/>
    <circle cx="1012" cy="570" r="8" fill="#1E96FF"/>
    <text x="1032" y="577" fill="#FFFFFF">CLAUDE + CODEX</text>
  </g>
  <text x="1230" y="612" text-anchor="end" fill="#7F8997" font-size="16" font-weight="500" font-family="-apple-system,BlinkMacSystemFont,Helvetica Neue,Arial,sans-serif">macOS Stream Deck plugin</text>
</svg>
